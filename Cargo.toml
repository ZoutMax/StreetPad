[package]
name = "StreetPad"
version = "1.0.0"
edition = "2024"
description = "Walk Google Street View with a game controller"
build = "build.rs"

[[bin]]
name = "StreetPad"
path = "src/main.rs"

[dependencies]
gilrs = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"
wry = "0.57.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
