<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>StreetPad controller layout</title>
  <rect x="0" y="0" width="1280" height="700" rx="22" fill="#171a20"/>
  <text x="640" y="52" text-anchor="middle" font-size="28" font-weight="600" fill="#f2f4f8">StreetPad controls</text>
  <text x="640" y="80" text-anchor="middle" font-size="15" fill="#9aa3b2">Xbox-style controller · tap / hold (½ s) · all buttons can be changed in Settings</text>

  <!-- controller body (original drawing) -->
  <g transform="translate(640 375)">
    <!-- triggers and bumpers -->
    <rect x="-205" y="-170" width="70" height="40" rx="14" fill="#3a404c"/>
    <rect x="135" y="-170" width="70" height="40" rx="14" fill="#3a404c"/>
    <rect x="-225" y="-138" width="120" height="26" rx="13" fill="#4a5160"/>
    <rect x="105" y="-138" width="120" height="26" rx="13" fill="#4a5160"/>
    <path d="M-230,-120 C-150,-140 150,-140 230,-120 C300,-100 330,40 300,140 C280,205 225,215 185,170 C150,130 120,100 0,100 C-120,100 -150,130 -185,170 C-225,215 -280,205 -300,140 C-330,40 -300,-100 -230,-120 Z" fill="#2b3039" stroke="#4a5160" stroke-width="3"/>
    <!-- left stick -->
    <circle cx="-185" cy="-50" r="44" fill="#1f232a" stroke="#596173" stroke-width="3"/>
    <circle cx="-185" cy="-50" r="27" fill="#3d4452"/>
    <!-- d-pad -->
    <g transform="translate(-95 40)" fill="#1f232a" stroke="#596173" stroke-width="2.5">
      <path d="M-14,-42 H14 V-14 H42 V14 H14 V42 H-14 V14 H-42 V-14 H-14 Z"/>
    </g>
    <!-- right stick -->
    <circle cx="95" cy="40" r="44" fill="#1f232a" stroke="#596173" stroke-width="3"/>
    <circle cx="95" cy="40" r="27" fill="#3d4452"/>
    <!-- face buttons -->
    <g font-size="20" font-weight="700" text-anchor="middle">
      <circle cx="185" cy="-95" r="22" fill="#3a3a22" stroke="#d9c64a" stroke-width="2.5"/><text x="185" y="-88" fill="#f0dd5a">Y</text>
      <circle cx="140" cy="-50" r="22" fill="#1f2c40" stroke="#4a8fe0" stroke-width="2.5"/><text x="140" y="-43" fill="#6aa8f0">X</text>
      <circle cx="230" cy="-50" r="22" fill="#3d2124" stroke="#e05a5a" stroke-width="2.5"/><text x="230" y="-43" fill="#f07070">B</text>
      <circle cx="185" cy="-5" r="22" fill="#1f3a26" stroke="#4fc06a" stroke-width="2.5"/><text x="185" y="2" fill="#6ad884">A</text>
    </g>
    <!-- view / menu -->
    <rect x="-50" y="-62" width="34" height="20" rx="10" fill="#1f232a" stroke="#596173" stroke-width="2"/>
    <rect x="16" y="-62" width="34" height="20" rx="10" fill="#1f232a" stroke="#596173" stroke-width="2"/>
    <text x="-33" y="-74" text-anchor="middle" font-size="12" fill="#9aa3b2">View</text>
    <text x="33" y="-74" text-anchor="middle" font-size="12" fill="#9aa3b2">Menu</text>
    <text x="-170" y="-156" text-anchor="middle" font-size="13" fill="#c7cdd8">LT</text>
    <text x="170" y="-156" text-anchor="middle" font-size="13" fill="#c7cdd8">RT</text>
    <text x="-165" y="-120" text-anchor="middle" font-size="12" fill="#e6e9ef">LB</text>
    <text x="165" y="-120" text-anchor="middle" font-size="12" fill="#e6e9ef">RB</text>
  </g>

  <!-- leader lines -->
  <g stroke="#5b6475" stroke-width="1.5" fill="none">
    <path d="M470,225 H330"/>   <!-- LT -->
    <path d="M465,250 H330 V262"/> <!-- LB (to label row 2) -->
    <path d="M455,325 H330"/>   <!-- left stick -->
    <path d="M545,415 H400 V440 H330"/> <!-- d-pad -->
    <path d="M607,323 V560 H330"/> <!-- View -->
    <path d="M810,225 H950"/>   <!-- RT -->
    <path d="M815,250 H950 V262"/> <!-- RB -->
    <path d="M847,280 H950"/>   <!-- Y -->
    <path d="M892,325 H950"/> <!-- B -->
    <path d="M847,370 H950"/> <!-- A -->
    <path d="M780,347 V410 H950"/> <!-- X -->
    <path d="M735,415 V505 H950"/> <!-- right stick -->
    <path d="M673,323 V570 H950"/> <!-- Menu -->
  </g>

  <!-- left labels -->
  <g font-size="15" fill="#e6e9ef" text-anchor="end">
    <text x="322" y="230"><tspan font-weight="700">LT</tspan>  zoom out (analog)</text>
    <text x="322" y="268"><tspan font-weight="700">LB</tspan>  snap turn left 90°</text>
    <text x="322" y="322"><tspan font-weight="700">Left stick</tspan>  walk · turn</text>
    <text x="322" y="341" fill="#9aa3b2">map: pan · click: run (hold)</text>
    <text x="322" y="438"><tspan font-weight="700">D-pad</tspan>  ↑ auto-walk · ↓ step back</text>
    <text x="322" y="457" fill="#9aa3b2">← / → previous / next bookmark</text>
    <text x="322" y="558"><tspan font-weight="700">View</tspan>  immersive mode (picture only)</text>
    <text x="322" y="577" fill="#9aa3b2">hold: fullscreen · on the map: quit</text>
  </g>

  <!-- right labels -->
  <g font-size="15" fill="#e6e9ef">
    <text x="958" y="230"><tspan font-weight="700">RT</tspan>  zoom in (analog)</text>
    <text x="958" y="268"><tspan font-weight="700">RB</tspan>  snap turn right 90°</text>
    <text x="958" y="294"><tspan font-weight="700">Y</tspan>  back · hold: Street View in / out</text>
    <text x="958" y="330"><tspan font-weight="700">B</tspan>  turn around 180°</text>
    <text x="958" y="375"><tspan font-weight="700">A</tspan>  click at the crosshair</text>
    <text x="958" y="415"><tspan font-weight="700">X</tspan>  save bookmark</text>
    <text x="958" y="434" fill="#9aa3b2">hold: search keyboard</text>
    <text x="958" y="503"><tspan font-weight="700">Right stick</tspan>  look around</text>
    <text x="958" y="522" fill="#9aa3b2">map: pan · click: level view</text>
    <text x="958" y="575"><tspan font-weight="700">Menu</tspan>  settings · hold: button guide</text>
  </g>

  <text x="640" y="672" text-anchor="middle" font-size="13" fill="#7d8696">On the map the crosshair stays centred: hold Y to show the blue Street View lines, release on a line to enter.</text>
</svg>
